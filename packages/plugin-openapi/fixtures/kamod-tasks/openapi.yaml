openapi: 3.1.0
info:
  title: Kamod Tasks API
  description: |
    REST API for managing projects and tasks in the Kamod workspace platform.
    Supports pagination, filtering, and bearer token authentication.
  version: 2.4.0
servers:
  - url: https://api.kamod.dev/v2
    description: Production
  - url: https://staging-api.kamod.dev/v2
    description: Staging
tags:
  - name: Projects
    description: Create and manage projects
  - name: Tasks
    description: Task lifecycle operations
  - name: Users
    description: User profile endpoints
paths:
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      description: Returns a paginated list of projects visible to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          description: Filter by project status
          schema:
            type: string
            enum: [active, archived]
          example: active
      responses:
        "200":
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
              example:
                data:
                  - id: proj_01HXYZ
                    name: Website relaunch
                    status: active
                page: 1
                limit: 20
                total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: Website relaunch
              description: Q3 marketing site refresh
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get project by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Archive a project
      deprecated: true
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project archived
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks in a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: assignee
          in: query
          schema:
            type: string
          example: usr_01ABC
        - name: X-Request-Id
          in: header
          schema:
            type: string
          description: Optional correlation ID
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "422":
          $ref: "#/components/responses/ValidationError"
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2 access token or personal access token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Unique project identifier
      schema:
        type: string
      example: proj_01HXYZ
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    Project:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          example: proj_01HXYZ
        name:
          type: string
          example: Website relaunch
        description:
          type: string
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    ProjectListResponse:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    Task:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          example: task_01DEF
        title:
          type: string
        status:
          type: string
          enum: [open, in_progress, done]
        assigneeId:
          type: string
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        assigneeId:
          type: string
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: Invalid or expired token
    BadRequest:
      description: Malformed request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_error
            message: title is required
