# Copy to .github/workflows/node-matrix.yml in your PreactPress site repository.
#
# Verifies check and build on Node.js 20 and 22. Useful for library docs or
# teams that must support multiple Node LTS versions.

name: PreactPress Node matrix

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: preactpress-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation check
        run: pnpm exec preactpress check

      - name: Build static site
        run: pnpm exec preactpress build

      - name: Upload build output
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: preactpress-dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
