# Copy to .github/workflows/check.yml in your PreactPress site repository.
#
# Runs preactpress check and build on pull requests and main-branch pushes.
# See https://github.com/kamod-ch/preactpress/tree/main/examples/github-actions

name: PreactPress check

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: preactpress-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation check
        run: pnpm exec preactpress check --format json --output reports/docs-check.json

      - name: Build static site
        run: pnpm exec preactpress build

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-report
          path: reports/docs-check.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: preactpress-dist
          path: dist/
          retention-days: 7
