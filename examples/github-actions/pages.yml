# Copy to .github/workflows/pages.yml in your PreactPress site repository.
#
# Builds and deploys dist/ to GitHub Pages via GitHub Actions.
# Set repository Settings → Pages → Source to "GitHub Actions".
#
# For a project site at https://user.github.io/my-repo/, the build step sets
# --base /my-repo/. For a user/org site at https://user.github.io/, remove
# the --base flag and set site.base to "/" in .preactpress/config.ts.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm exec preactpress check

      - name: Build for GitHub Pages
        run: pnpm exec preactpress build --base /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
