name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "templates/docs/**"
      - "assets/**"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "templates/docs/pnpm-lock.yaml"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Sync bundled template lockfiles
        run: pnpm run sync:template-lockfiles

      - name: Install docs starter dependencies
        working-directory: templates/docs
        run: pnpm install --frozen-lockfile

      - name: Build docs for GitHub Pages
        working-directory: templates/docs
        env:
          PREACTPRESS_INCLUDE_MATOMO: "true"
        run: pnpm exec preactpress build . --base /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: templates/docs/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
